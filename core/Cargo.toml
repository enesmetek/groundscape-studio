[package]
name = "groundscape-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = [
  "dep:wasm-bindgen",
  "dep:serde-wasm-bindgen",
  "dep:console_error_panic_hook",
]

[dependencies]
jagua-rs = { version = "=0.8.1", features = ["bpp"] }
dxf = "=0.6.1"
# dxf'in uuid bağımlılığı wasm32'de bir rastgelelik kaynağı ister; js feature'ı
# feature unification ile ona uygulanır (native derlemede etkisizdir).
uuid = { version = "1", features = ["js"] }
geo = "=0.33.1"
serde = { version = "1", features = ["derive"] }
rand = "0.10"

wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
